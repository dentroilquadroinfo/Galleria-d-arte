<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentro il Quadro | Galleria Digitale</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: #020617; color: #f8fafc; font-family: 'Times New Roman', serif; overflow-x: hidden; scroll-behavior: smooth; }
        
        /* Header Istituzionale */
        .site-header { padding: 60px 20px; text-align: center; border-bottom: 1px solid #d4af37; background: #020617; }
        .site-header h1 { color: #d4af37; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 12px; margin: 0; }
        .site-header p { color: #64748b; letter-spacing: 5px; font-size: 0.8rem; margin-top: 15px; text-transform: uppercase; }

        /* Sezioni delle Opere - Stile Monumentale */
        .work-section {
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid #1e293b;
            overflow: hidden;
        }

        .work-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            transition: transform 2s ease, opacity 1s ease;
            z-index: 1;
        }

        .work-section:hover .work-bg { transform: scale(1.05); opacity: 0.5; }

        .work-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 900px;
            padding: 40px;
        }

        .work-content span { color: #d4af37; letter-spacing: 5px; text-transform: uppercase; font-size: 0.9rem; font-weight: bold; }
        .work-content h2 { font-size: 4rem; margin: 20px 0; letter-spacing: 3px; text-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        /* Pulsante Esplora */
        .btn-explore {
            display: inline-block;
            margin-top: 30px;
            padding: 18px 50px;
            border: 1px solid #d4af37;
            color: #d4af37;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
            transition: all 0.4s ease;
            font-size: 0.8rem;
        }

        .btn-explore:hover {
            background: #d4af37;
            color: #020617;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }

        /* Footer */
        .site-footer { text-align: center; padding: 100px 20px; background: #020617; border-top: 1px solid #d4af37; }
        .footer-logo { color: #d4af37; font-style: italic; font-size: 1.2rem; letter-spacing: 2px; }

        @media (max-width: 768px) {
            .work-content h2 { font-size: 2.5rem; }
            .work-section { height: 70vh; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <h1>Dentro il Quadro</h1>
        <p>Archivio Digitale di Analisi Critica</p>
    </header>

    <section class="work-section">
        <div class="work-bg" style="background-image: url('conti_totale.JPG');"></div>
        <div class="work-content">
            <span>William Turner</span>
            <h2>The Burning of Parliament</h2>
            <a href="turner2.html" class="btn-explore">Esplora l'Analisi</a>
        </div>
    </section>

    <section class="work-section">
        <div class="work-bg" style="background-image: url('hopper_totale.JPG');"></div>
        <div class="work-content">
            <span>Edward Hopper</span>
            <h2>Nighthawks</h2>
            <a href="hopper.html" class="btn-explore">Esplora l'Analisi</a>
        </div>
    </section>

    <section class="work-section">
        <div class="work-bg" style="background-image: url('vangogh_totale.JPG');"></div>
        <div class="work-content">
            <span>Vincent Van Gogh</span>
            <h2>Notte Stellata</h2>
            <a href="vangogh.html" class="btn-explore">Esplora l'Analisi</a>
        </div>
    </section>

    <footer class="site-footer">
        <div class="footer-logo">"Dentro il Quadro - Un viaggio oltre la tela"</div>
        <p style="color: #64748b; font-size: 0.8rem; margin-top: 20px; letter-spacing: 2px;">&copy; 2026 Progetto Galleria Digitale</p>
    </footer>

</body>
</html>

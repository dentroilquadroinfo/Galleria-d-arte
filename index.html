<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oltre la Cornice | Un viaggio dentro l'arte</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #1a1a1a; --card: #ffffff; }
        body { background-color: var(--bg); margin: 0; font-family: 'Lato', sans-serif; color: white; }
        
        /* HEADER */
        header { 
            background: #432818; 
            padding: 60px 20px; 
            text-align: center; 
            border-bottom: 5px solid var(--gold);
        }
        h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; margin: 0; color: white; }
        .subtitle { font-size: 1.3rem; color: var(--gold); margin-top: 10px; font-style: italic; }

        /* GALLERIA */
        .gallery { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 40px; 
            padding: 50px 20px; 
        }
        .card { 
            background: var(--card); 
            border-radius: 15px; 
            overflow: hidden; 
            width: 100%; 
            max-width: 500px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-10px); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card-content { padding: 25px; text-align: center; color: #333; }
        .card-content h2 { font-family: 'Playfair Display', serif; margin: 0 0 15px; font-size: 1.8rem; }
        
        /* BOTTONI */
        .btn { 
            display: inline-block; 
            padding: 12px 35px; 
            background: #d4a373; 
            color: white; 
            text-decoration: none; 
            border-radius: 25px; 
            font-weight: bold; 
            transition: 0.3s;
        }
        .btn:hover { background: #b5895e; }

        footer { text-align: center; padding: 40px; font-size: 0.9rem; opacity: 0.6; }
    </style>
</head>
<body>

    <header>
        <h1>Oltre la Cornice</h1>
        <p class="subtitle">Oltre lo sguardo: un viaggio dentro l'arte</p>
    </header>

    <div class="gallery">
        <div class="card">
            <img src="hopper_totale.JPG" alt="Edward Hopper">
            <div class="card-content">
                <h2>Hopper</h2>
                <a href="hopper.html" class="btn">Entra</a>
            </div>
        </div>

        <div class="card">
            <img src="turner_full.JPG" alt="William Turner">
            <div class="card-content">
                <h2>Turner</h2>
                <a href="turner.html" class="btn">Esplora</a>
            </div>
        </div>

        <div class="card">
            <img src="quadro.jpg.JPG" alt="Borrell del Caso">
            <div class="card-content">
                <h2>Borrell</h2>
                <a href="borrell.html" class="btn">Guarda</a>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Oltre la Cornice - Napoli
    </footer>

</body>
</html>

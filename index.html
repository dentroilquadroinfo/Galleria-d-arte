<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oltre la Cornice - Galleria</title>
    <style>
        body { background-color: #f4f1ea; font-family: sans-serif; margin: 0; text-align: center; }
        header { background: #2c3e50; color: white; padding: 40px; border-bottom: 5px solid #d4a373; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 40px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; overflow: hidden; border: 1px solid #ddd; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 20px; }
        .btn { display: inline-block; padding: 10px 20px; background: #d4a373; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <header><h1>Oltre la Cornice</h1><p>La tua galleria d'arte digitale</p></header>
    <div class="gallery">
        <div class="card">
            <img src="image.png">
            <div class="card-body"><h3>Hopper</h3><a href="hopper.html" class="btn">Entra</a></div>
        </div>
        <div class="card">
            <img src="turner_full.jpg">
            <div class="card-body"><h3>Turner</h3><a href="turner.html" class="btn">Esplora</a></div>
        </div>
        <div class="card">
            <img src="cornice.png"> <div class="card-body"><h3>Borrell</h3><a href="borrell.html" class="btn">Guarda</a></div>
        </div>
    </div>
</body>
</html>

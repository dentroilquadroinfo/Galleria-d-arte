<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentro il Quadro | Galleria a Griglia</title>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Times New Roman', serif; margin: 0; padding: 0; }
        
        /* Header */
        header { padding: 50px 20px; text-align: center; border-bottom: 1px solid #d4af37; margin-bottom: 50px; }
        header h1 { color: #d4af37; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 8px; margin: 0; }
        header p { color: #64748b; letter-spacing: 4px; font-size: 0.9rem; margin-top: 10px; }

        /* Contenitore Griglia */
        .grid-container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px 100px;
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 40px; 
        }

        /* Singola Scheda Opera */
        .art-card { 
            background: #0f172a; 
            border: 1px solid #1e293b; 
            border-radius: 8px; 
            overflow: hidden; 
            transition: all 0.4s ease;
            position: relative;
        }

        .art-card:hover { 
            border-color: #d4af37; 
            transform: translateY(-10px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
        }

        .card-image { 
            height: 450px; 
            background-size: cover; 
            background-position: center; 
            transition: transform 0.6s ease;
        }

        .art-card:hover .card-image { transform: scale(1.05); }

        .card-info { padding: 30px; text-align: center; }
        .card-info span { color: #d4af37; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px; display: block; margin-bottom: 10px; }
        .card-info h2 { margin: 0; font-size: 1.5rem; letter-spacing: 1px; color: #fff; }

        /* Link sulla scheda */
        .card-link { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 5; 
        }

        /* Footer */
        .footer { text-align: center; padding: 60px; border-top: 1px solid #d4af37; color: #64748b; font-size: 0.8rem; letter-spacing: 2px; }

        @media (max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Dentro il Quadro</h1>
        <p>Galleria Monografica</p>
    </header>

    <div class="grid-container">
        
        <div class="art-card">
            <div class="card-image" style="background-image: url('conti_totale.JPG');"></div>
            <div class="card-info">
                <span>William Turner</span>
                <h2>The Burning of Parliament</h2>
            </div>
            <a href="turner2.html" class="card-link"></a>
        </div>

        <div class="art-card">
            <div class="card-image" style="background-image: url('hopper_totale.JPG');"></div>
            <div class="card-info">
                <span>Edward Hopper</span>
                <h2>Nighthawks</h2>
            </div>
            <a href="hopper.html" class="card-link"></a>
        </div>

        <div class="art-card">
            <div class="card-image" style="background-image: url('vangogh_totale.JPG');"></div>
            <div class="card-info">
                <span>Vincent Van Gogh</span>
                <h2>Notte Stellata</h2>
            </div>
            <a href="vangogh.html" class="card-link"></a>
        </div>

    </div>

    <div class="footer">
        &copy; 2026 Dentro il Quadro | Archivio Digitale
    </div>

</body>
</html>

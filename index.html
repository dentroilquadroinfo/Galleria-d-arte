<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentro il Quadro | Galleria</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #1a1a1a; --header-bg: #432818; }
        body { background-color: var(--bg); margin: 0; font-family: 'Lato', sans-serif; color: white; text-align: center; }
        header { background: var(--header-bg); padding: 80px 20px; border-bottom: 5px solid var(--gold); }
        h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; margin: 0; color: white; letter-spacing: 2px; }
        .subtitle { font-size: 1.4rem; color: var(--gold); margin: 15px 0 0; font-style: italic; font-weight: 300; }
        .gallery { display: flex; flex-direction: column; align-items: center; gap: 50px; padding: 80px 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 4px; overflow: hidden; width: 100%; max-width: 550px; box-shadow: 0 30px 60px rgba(0,0,0,0.7); transition: transform 0.4s ease; }
        .card:hover { transform: translateY(-15px); }
        .card img { width: 100%; height: 300px; object-fit: cover; border-bottom: 4px solid var(--gold); }
        .card-content { padding: 40px; text-align: center; color: #1a1a1a; }
        .card-content h2 { font-family: 'Playfair Display', serif; margin: 0 0 25px; font-size: 2.2rem; color: var(--header-bg); }
        .btn { display: inline-block; padding: 16px 50px; background: var(--header-bg); color: var(--gold); text-decoration: none; border-radius: 2px; font-weight: bold; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px; border: 1px solid var(--gold); }
        .btn:hover { background: var(--gold); color: var(--header-bg); }
    </style>
</head>
<body>
    <header>
        <h1>Dentro il Quadro</h1>
        <p class="subtitle">Oltre la cornice: un viaggio nell'arte</p>
    </header>
    <div class="gallery">
        <div class="card">
            <img src="hopper_totale.JPG" alt="Hopper">
            <div class="card-content">
                <h2>Hopper</h2>
                <a href="hopper.html" class="btn">Entra</a>
            </div>
        </div>
        
        <div class="card">
            <img src="turner_full.JPG" alt="Turner">
            <div class="card-content">
                <h2>Turner</h2>
                <a href="turner.html" class="btn">Esplora</a>
            </div>
        </div>
        
        <div class="card">
            <img src="quadro.jpg.JPG" alt="Borrell">
            <div class="card-content">
                <h2>Borrell</h2>
                <a href="borrell.html" class="btn">Guarda</a>
            </div>
        </div>
    </div>
</body>
</html>

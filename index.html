<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentro il Quadro | Galleria</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #1a1a1a; --card-bg: #ffffff; }
        body { background-color: var(--bg); margin: 0; font-family: 'Lato', sans-serif; color: white; text-align: center; }
        header { background: #432818; padding: 60px 20px; border-bottom: 5px solid var(--gold); }
        h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin: 0; }
        .gallery { display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 40px 20px; }
        .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; width: 100%; max-width: 500px; color: #1a1a1a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card img { width: 100%; height: 280px; object-fit: cover; border-bottom: 4px solid var(--gold); }
        .card-content { padding: 30px; }
        .btn { display: inline-block; padding: 15px 40px; background: #432818; color: var(--gold); text-decoration: none; font-weight: bold; border-radius: 4px; border: 1px solid var(--gold); text-transform: uppercase; }
    </style>
</head>
<body>
    <header>
        <h1>Dentro il Quadro</h1>
        <p style="color: var(--gold); font-style: italic;">Viaggio nell'arte digitale</p>
    </header>
    <div class="gallery">
        <div class="card"><img src="hopper_totale.JPG" alt="Hopper"><div class="card-content"><h2>Hopper</h2><a href="hopper.html" class="btn">Entra</a></div></div>
        <div class="card"><img src="turner_full.JPG" alt="Turner"><div class="card-content"><h2>Turner</h2><a href="turner.html" class="btn">Esplora</a></div></div>
        <div class="card"><img src="seurat_totale.jpg" alt="Seurat"><div class="card-content"><h2>Seurat</h2><a href="seurat.html" class="btn">Scopri</a></div></div>
    </div>
</body>
</html>
